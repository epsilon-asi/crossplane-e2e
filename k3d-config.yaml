apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: xp-test
servers: 1
agents: 0
image: rancher/k3s:v1.37.1-k3s1
options:
  k3d:
    wait: true
    timeout: 120s
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --disable=servicelb
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
