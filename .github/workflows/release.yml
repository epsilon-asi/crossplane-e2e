name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=(--repo "$REPO" --verify-tag --generate-notes --title "$TAG")
          # Pre-release tags (v0.2.0-rc.1) are marked as such.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
